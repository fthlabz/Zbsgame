<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smash Bugs</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: #1e272e;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: manipulation;
        }

        /* Arka Plan */
        .wood-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2f3640 0%, #191e24 100%);
            z-index: 0;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 20px 30px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: 800;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #score { color: #ffdd59; }
        #timer { color: #ff5e57; }

        /* Oyun Alanı (Böceklerin Koştuğu Yer) */
        #game-area {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            overflow: hidden;
        }

        /* Böcek Tasarımı */
        .bug {
            position: absolute;
            width: 70px;
            height: 70px;
            font-size: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: crosshair;
            pointer-events: auto;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.5));
            /* Yürüme animasyonu */
            animation: walk 0.15s infinite alternate ease-in-out;
        }

        @keyframes walk {
            0% { transform: scale(1) rotate(-5deg); }
            100% { transform: scale(1) rotate(5deg); }
        }

        /* Vurma ve Kaçma Efektleri */
        .effect {
            position: absolute;
            pointer-events: none;
            z-index: 6;
            font-size: 60px;
            transform: translate(-50%, -50%);
        }

        .splat {
            animation: splatAnim 0.3s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes splatAnim {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
        }

        .laugh {
            animation: laughAnim 0.8s forwards;
            font-size: 40px;
        }
        @keyframes laughAnim {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1.2); opacity: 0; }
        }

        /* Menü Ekranı */
        #menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 20, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: auto;
        }

        .logo {
            font-size: 50px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .diff-btn {
            background: #485460;
            color: white;
            border: none;
            padding: 15px 40px;
            margin: 10px;
            font-size: 22px;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            width: 250px;
            transition: 0.2s;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #1e272e;
        }

        .diff-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #1e272e;
        }

        .btn-easy { background: #0be881; color: #1e272e; }
        .btn-med { background: #ffd32a; color: #1e272e; }
        .btn-hard { background: #ff3f34; }
        
        .game-over-text {
            display: none;
            font-size: 24px;
            color: #d2dae2;
            margin-bottom: 20px;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="wood-bg"></div>

    <div id="game-area"></div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="panel">Skor: <span id="score">0</span></div>
            <div class="panel">Süre: <span id="timer">30</span></div>
        </div>
    </div>

    <div id="menu-screen">
        <div class="logo">🪳 SMASH BUGS</div>
        <div class="game-over-text" id="game-over-text">Süre Bitti!<br>Toplam Skor: <b id="final-score">0</b></div>
        
        <button class="diff-btn btn-easy" onclick="startGame('easy')">KOLAY</button>
        <button class="diff-btn btn-med" onclick="startGame('medium')">ORTA</button>
        <button class="diff-btn btn-hard" onclick="startGame('hard')">ZOR</button>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const menuScreen = document.getElementById('menu-screen');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const gameOverText = document.getElementById('game-over-text');
        const finalScoreEl = document.getElementById('final-score');

        let score = 0;
        let timeLeft = 30;
        let isPlaying = false;
        let gameLoop, spawnLoop;
        
        // Zorluk Ayarları: { Doğma Sıklığı (ms), Geçiş Süresi (ms) }
        const difficulties = {
            easy: { spawn: 900, speed: 4000 },
            medium: { spawn: 600, speed: 2500 },
            hard: { spawn: 350, speed: 1500 }
        };
        let currentSettings = difficulties.medium;

        // Web Audio API ile Ses Sentezleme (Harici dosya linki kırılmasın diye)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSlap() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playLaugh() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            [0, 0.15].forEach((t, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400 + (i*50), audioCtx.currentTime + t);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + t + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + t);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + t + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + t); osc.stop(audioCtx.currentTime + t + 0.1);
            });
        }

        function startGame(level) {
            currentSettings = difficulties[level];
            score = 0;
            timeLeft = 30;
            scoreEl.innerText = score;
            timerEl.innerText = timeLeft;
            gameArea.innerHTML = '';
            menuScreen.style.display = 'none';
            gameOverText.style.display = 'none';
            isPlaying = true;

            gameLoop = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);

            spawnLoop = setInterval(createBug, currentSettings.spawn);
        }

        function createBug() {
            if (!isPlaying) return;

            const bug = document.createElement('div');
            bug.className = 'bug';
            bug.innerText = '🪳';

            const w = window.innerWidth;
            const h = window.innerHeight;
            
            // Ekranın hangi kenarından girecek? (0:Sol, 1:Sağ, 2:Üst, 3:Alt)
            const edge = Math.floor(Math.random() * 4);
            let startX, startY, endX, endY, rotation;

            if (edge === 0) { // Soldan sağa
                startX = -100; startY = Math.random() * h;
                endX = w + 100; endY = Math.random() * h;
                rotation = 90;
            } else if (edge === 1) { // Sağdan sola
                startX = w + 100; startY = Math.random() * h;
                endX = -100; endY = Math.random() * h;
                rotation = -90;
            } else if (edge === 2) { // Üstten alta
                startX = Math.random() * w; startY = -100;
                endX = Math.random() * w; endY = h + 100;
                rotation = 180;
            } else { // Alttan üste
                startX = Math.random() * w; startY = h + 100;
                endX = Math.random() * w; endY = -100;
                rotation = 0;
            }

            // Açı hesabı (Böceğin gittiği yöne bakması için)
            const angleRad = Math.atan2(endY - startY, endX - startX);
            let angleDeg = (angleRad * 180 / Math.PI) + 90;

            // Elementi sahneye ekle ve başlangıç pozisyonunu ver
            gameArea.appendChild(bug);

            // JS Web Animations API ile akıcı hareket
            const animation = bug.animate([
                { transform: `translate(${startX}px, ${startY}px) rotate(${angleDeg}deg)` },
                { transform: `translate(${endX}px, ${endY}px) rotate(${angleDeg}deg)` }
            ], {
                duration: currentSettings.speed,
                easing: 'linear',
                fill: 'forwards'
            });

            // Böcek tıklandığında (Vurulma)
            const killEvent = (e) => {
                if(e.cancelable) e.preventDefault();
                animation.pause();
                playSlap();
                
                score += 10;
                scoreEl.innerText = score;

                // Patlama Efekti (Splat)
                const rect = bug.getBoundingClientRect();
                createEffect('💥', rect.left + 35, rect.top + 35, 'splat');
                
                bug.remove();
            };

            bug.addEventListener('mousedown', killEvent);
            bug.addEventListener('touchstart', killEvent, {passive: false});

            // Animasyon bittiğinde (Kaçma)
            animation.onfinish = () => {
                if (bug.parentNode) {
                    playLaugh();
                    createEffect('🤭', endX, endY, 'laugh');
                    bug.remove();
                }
            };
        }

        function createEffect(emoji, x, y, className) {
            const el = document.createElement('div');
            el.className = `effect ${className}`;
            el.innerText = emoji;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            gameArea.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameLoop);
            clearInterval(spawnLoop);
            gameArea.innerHTML = ''; // Sahneyi temizle
            
            finalScoreEl.innerText = score;
            gameOverText.style.display = 'block';
            menuScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
