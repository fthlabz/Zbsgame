<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZBS GAME</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: #11141a;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: manipulation;
        }

        /* Oyun Arka Planı */
        .game-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #2c3e50 0%, #000000 100%);
            z-index: 0;
        }

        /* UI (Üst Bilgi Paneli) */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 15;
            pointer-events: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px 25px;
        }

        .panel {
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 25px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 900;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        #score { color: #00d2d3; text-shadow: 0 0 10px rgba(0, 210, 211, 0.5); }
        #timer { color: #ff6b6b; text-shadow: 0 0 10px rgba(255, 107, 107, 0.5); }

        /* Oyun Alanı */
        #game-area {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            overflow: hidden;
        }

        /* Hedefler (Böcekler ve Bombalar) */
        .target {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: crosshair;
            pointer-events: auto;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6));
        }

        /* Yürüme / Titreme Animasyonu */
        .walk-anim {
            animation: walk 0.15s infinite alternate ease-in-out;
        }

        @keyframes walk {
            0% { transform: rotate(-8deg); }
            100% { transform: rotate(8deg); }
        }

        /* Efektler (Patlama ve Puan Yazıları) */
        .effect {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            transform: translate(-50%, -50%);
            font-weight: 900;
            text-shadow: 0 3px 5px rgba(0,0,0,0.8);
        }

        .splat {
            font-size: 70px;
            animation: splatAnim 0.35s ease-out forwards;
        }
        @keyframes splatAnim {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
        }

        .floating-text {
            font-size: 35px;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1.5); opacity: 0; }
        }
        .text-green { color: #1dd1a1; }
        .text-red { color: #ff6b6b; }

        .laugh {
            font-size: 45px;
            animation: floatUp 0.8s forwards;
        }

        /* YENİ ZBS GAME ANA MENÜSÜ */
        #menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1e272e 0%, #0d1117 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: auto;
        }

        .zbs-logo {
            font-size: 70px;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(135deg, #00d2d3, #5f27cd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 20px rgba(0, 210, 211, 0.3));
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .subtitle {
            color: #8395a7;
            font-size: 18px;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .diff-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 16px 50px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            width: 280px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .diff-btn:hover { transform: translateY(-3px); }
        .diff-btn:active { transform: translateY(2px); }

        .btn-easy { border-color: #1dd1a1; color: #1dd1a1; }
        .btn-easy:hover { background: rgba(29, 209, 161, 0.2); box-shadow: 0 0 15px rgba(29, 209, 161, 0.4); }
        
        .btn-med { border-color: #feca57; color: #feca57; }
        .btn-med:hover { background: rgba(254, 202, 87, 0.2); box-shadow: 0 0 15px rgba(254, 202, 87, 0.4); }
        
        .btn-hard { border-color: #ff6b6b; color: #ff6b6b; }
        .btn-hard:hover { background: rgba(255, 107, 107, 0.2); box-shadow: 0 0 15px rgba(255, 107, 107, 0.4); }

        #game-over-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }
        .over-title { color: #ff6b6b; font-size: 30px; font-weight: bold; margin-bottom: 10px; }
        .over-score { color: #00d2d3; font-size: 45px; font-weight: 900; }

    </style>
</head>
<body>

    <div class="game-bg"></div>
    <div id="game-area"></div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="panel">SKOR: <span id="score">0</span></div>
            <div class="panel">SÜRE: <span id="timer">30</span></div>
        </div>
    </div>

    <!-- ZBS GAME ANA MENÜ -->
    <div id="menu-screen">
        <div class="zbs-logo">ZBS GAME</div>
        <div class="subtitle" id="menu-sub">Böcekleri Ez, Bombalardan Uzak Dur!</div>
        
        <div id="game-over-panel">
            <div class="over-title">SÜRE BİTTİ!</div>
            <div class="over-score" id="final-score">0</div>
        </div>

        <div class="btn-group">
            <button class="diff-btn btn-easy" onclick="startGame('easy')">KOLAY</button>
            <button class="diff-btn btn-med" onclick="startGame('medium')">ORTA</button>
            <button class="diff-btn btn-hard" onclick="startGame('hard')">ZOR</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const menuScreen = document.getElementById('menu-screen');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const gameOverPanel = document.getElementById('game-over-panel');
        const finalScoreEl = document.getElementById('final-score');
        const menuSub = document.getElementById('menu-sub');

        let score = 0;
        let timeLeft = 30;
        let isPlaying = false;
        let gameLoop, spawnLoop;
        
        const difficulties = {
            easy: { spawn: 1000, speedBase: 4000 },
            medium: { spawn: 650, speedBase: 2500 },
            hard: { spawn: 400, speedBase: 1600 }
        };
        let currentDiff = difficulties.medium;

        // --- SES EFEKTLERİ (Harici dosya kullanmadan, anlık üretim) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSplatSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playExplosionSound() { // BOMBA SESİ
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const bufferSize = audioCtx.sampleRate * 0.5; // 0.5 saniye gürültü
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            noise.start();
        }

        function playLaughSound() { // KAÇMA SESİ
            if (audioCtx.state === 'suspended') audioCtx.resume();
            [0, 0.15].forEach((t, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500 + (i*50), audioCtx.currentTime + t);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + t + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + t);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + t + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + t); osc.stop(audioCtx.currentTime + t + 0.1);
            });
        }

        function startGame(level) {
            currentDiff = difficulties[level];
            score = 0;
            timeLeft = 30;
            scoreEl.innerText = score;
            timerEl.innerText = timeLeft;
            gameArea.innerHTML = '';
            
            menuScreen.style.display = 'none';
            gameOverPanel.style.display = 'none';
            menuSub.style.display = 'none';
            isPlaying = true;

            gameLoop = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);

            spawnLoop = setInterval(spawnTarget, currentDiff.spawn);
        }

        function spawnTarget() {
            if (!isPlaying) return;

            const el = document.createElement('div');
            el.className = 'target';
            
            // Düşman Tipi Belirleme (Normal, Büyük, Bomba)
            const rand = Math.random();
            let type, emoji, pointValue, size, speedMult, hue;

            if (rand > 0.80) {
                // BOMBA (%20 İhtimal)
                type = 'bomb'; emoji = '💣'; pointValue = -20; size = 75; speedMult = 1.2; hue = 0;
            } else if (rand > 0.60) {
                // BÜYÜK BÖCEK (%20 İhtimal) - Çok Puan, Yavaş
                type = 'big'; emoji = '🪳'; pointValue = 30; size = 110; speedMult = 1.6; hue = Math.floor(Math.random() * 360);
            } else {
                // NORMAL BÖCEK (%60 İhtimal)
                type = 'normal'; emoji = '🪳'; pointValue = 10; size = 75; speedMult = 1; hue = Math.floor(Math.random() * 360);
            }

            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.fontSize = (size * 0.8) + 'px';
            
            // Renk filtresi ve Animasyon
            el.innerHTML = `<div class="${type !== 'bomb' ? 'walk-anim' : ''}" style="filter: hue-rotate(${hue}deg)">${emoji}</div>`;

            const w = window.innerWidth;
            const h = window.innerHeight;
            
            // Ekranın hangi kenarından girecek? (0:Sol, 1:Sağ, 2:Üst, 3:Alt)
            const edge = Math.floor(Math.random() * 4);
            let startX, startY, endX, endY;

            if (edge === 0) { startX = -100; startY = Math.random() * h; endX = w + 100; endY = Math.random() * h; }
            else if (edge === 1) { startX = w + 100; startY = Math.random() * h; endX = -100; endY = Math.random() * h; }
            else if (edge === 2) { startX = Math.random() * w; startY = -100; endX = Math.random() * w; endY = h + 100; }
            else { startX = Math.random() * w; startY = h + 100; endX = Math.random() * w; endY = -100; }

            const angleRad = Math.atan2(endY - startY, endX - startX);
            let angleDeg = (angleRad * 180 / Math.PI) + 90;

            gameArea.appendChild(el);

            const duration = currentDiff.speedBase * speedMult;

            const animation = el.animate([
                { transform: `translate(${startX}px, ${startY}px) rotate(${angleDeg}deg)` },
                { transform: `translate(${endX}px, ${endY}px) rotate(${angleDeg}deg)` }
            ], { duration: duration, easing: 'linear', fill: 'forwards' });

            // Tıklama Olayı (Vurma)
            const hitEvent = (e) => {
                if(e.cancelable) e.preventDefault();
                animation.pause();
                
                const rect = el.getBoundingClientRect();
                const hitX = rect.left + (size/2);
                const hitY = rect.top + (size/2);

                if (type === 'bomb') {
                    playExplosionSound();
                    score += pointValue;
                    createEffect('💥', hitX, hitY, 'splat');
                    createEffect('-20', hitX, hitY, 'floating-text text-red');
                } else {
                    playSplatSound();
                    score += pointValue;
                    createEffect('💥', hitX, hitY, 'splat');
                    createEffect(`+${pointValue}`, hitX, hitY, 'floating-text text-green');
                }

                scoreEl.innerText = score;
                el.remove();
            };

            el.addEventListener('mousedown', hitEvent);
            el.addEventListener('touchstart', hitEvent, {passive: false});

            // Ekrandan Çıkma (Kaçma)
            animation.onfinish = () => {
                if (el.parentNode) {
                    if (type !== 'bomb') {
                        playLaughSound();
                        createEffect('🤭', endX, endY, 'laugh');
                    }
                    el.remove();
                }
            };
        }

        function createEffect(content, x, y, classes) {
            const effectEl = document.createElement('div');
            effectEl.className = `effect ${classes}`;
            effectEl.innerText = content;
            effectEl.style.left = `${x}px`;
            effectEl.style.top = `${y}px`;
            gameArea.appendChild(effectEl);
            setTimeout(() => effectEl.remove(), 800);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameLoop);
            clearInterval(spawnLoop);
            gameArea.innerHTML = '';
            
            finalScoreEl.innerText = score;
            gameOverPanel.style.display = 'flex';
            menuScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
